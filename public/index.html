<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🃏 德州筹码</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0d1b14; --card: #15291f; --accent: #f0b90b; --felt: #1a4731;
  --text: #e4e7eb; --sub: #8b949e; --danger: #e74c3c; --green: #27ae60;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 20px;
}

/* ───── 顶栏 ───── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: var(--card); position: sticky; top: 0; z-index: 100;
  border-bottom: 1px solid #2a4a3a;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.avatar-wrap { width: 40px; height: 40px; flex-shrink: 0; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 18px; font-weight: bold; color: #fff; border: 2px solid #ffffff33;
}
.topbar-info { flex: 1; min-width: 0; }
.topbar-name-row { display: flex; align-items: center; gap: 6px; }
.player-name { font-size: 14px; font-weight: 600; cursor: pointer; }
.balance-row { display: flex; gap: 10px; font-size: 11px; margin-top: 1px; align-items: center; }
.balance-val { color: var(--accent); font-weight: 700; font-size: 13px; }
.winloss-val { font-weight: 700; }
.winloss-pos { color: var(--green); }
.winloss-neg { color: var(--danger); }
.conn-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.conn-ok { background: var(--green); box-shadow: 0 0 4px var(--green); }
.conn-bad { background: var(--danger); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ───── 中央底池 ───── */
.pot-area {
  background: var(--felt); margin: 12px; border-radius: 20px; padding: 24px 16px;
  text-align: center; position: relative; overflow: hidden;
  box-shadow: inset 0 0 40px rgba(0,0,0,0.5); border: 2px solid #2a5a3e;
}
.pot-area::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at center, rgba(255,255,255,0.06) 0%, transparent 70%);
  pointer-events: none;
}
.pot-label { font-size: 12px; color: #88b09a; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
.pot-amount {
  font-size: 52px; font-weight: 800; color: var(--accent);
  text-shadow: 0 2px 8px rgba(240,185,11,0.4); line-height: 1.1;
}
.pot-chips {
  display: flex; justify-content: center; gap: 12px; margin-top: 10px; margin-bottom: 8px;
  height: 82px; align-items: flex-end; perspective: 200px;
}
.chip-stack { position: relative; width: 34px; height: 74px; }
.chip-stack .chip {
  position: absolute; left: 2px;
  width: 30px; height: 14px;
  border-radius: 50% / 40%;
  border-top: 2px solid rgba(255,255,255,0.4);
  box-shadow: 0 1px 1px rgba(0,0,0,0.35);
  animation: drop 0.25s ease;
}
.chip-stack .denom {
  position: absolute; bottom: -16px; left: 0; right: 0;
  text-align: center; font-size: 10px; font-weight: 700;
  opacity: 0.7; letter-spacing: 1px;
}
@keyframes drop { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ───── 牌桌玩家下注标签 ───── */
.pot-bets {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
  margin-top: 12px; position: relative; z-index: 1; min-height: 0;
}
.pot-bet-tag {
  display: flex; align-items: center; gap: 4px;
  background: rgba(0,0,0,0.4); border: 1px solid #ffffff22; border-radius: 10px;
  padding: 3px 8px 3px 3px; animation: drop 0.3s ease; transition: all 0.2s;
}
.pot-bet-tag.me { border-color: var(--accent); box-shadow: 0 0 6px rgba(240,185,11,0.3); }
.pot-bet-tag.offline { opacity: 0.4; }
.pot-bet-tag.folded { opacity: 0.5; filter: grayscale(0.6); }
.pbt-avatar {
  width: 20px; height: 20px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 9px; font-weight: bold; color: #fff; flex-shrink: 0;
}
.pbt-info { display: flex; flex-direction: column; gap: 0; }
.pbt-name { font-size: 10px; color: #c0d8c8; line-height: 1.1; max-width: 50px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pbt-amount { font-size: 12px; font-weight: 800; color: var(--accent); line-height: 1.1; }

.pot-win-btn {
  margin-top: 16px; padding: 14px 48px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, #f0b90b, #e0940a);
  color: #1a1a1a; font-size: 18px; font-weight: 800; cursor: pointer;
  transition: transform 0.1s; box-shadow: 0 4px 12px rgba(240,185,11,0.3);
  position: relative; z-index: 1;
}
.pot-win-btn:active { transform: scale(0.95); }
.pot-win-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.pot-stats {
  display: flex; justify-content: center; gap: 20px; margin-top: 8px;
  font-size: 11px; color: #88b09a; position: relative; z-index: 1;
}
.pot-stat-val { color: #c0d8c8; font-weight: 600; }

/* ───── 下注面板 ───── */
.bet-panel {
  background: var(--card); margin: 0 12px; border-radius: 14px; padding: 14px;
}
.bet-panel-title { font-size: 12px; color: var(--sub); margin-bottom: 10px; }
.quick-bet-row { display: flex; gap: 8px; flex-wrap: wrap; }
.quick-btn {
  flex: 1; min-width: 52px; padding: 12px 0; border: none; border-radius: 12px;
  font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.1s;
}
.quick-btn:active { transform: scale(0.9); }
.quick-btn-1 { background: linear-gradient(135deg, #3498db, #2c3e50); color: #fff; }
.quick-btn-2 { background: linear-gradient(135deg, #9b59b6, #8e44ad); color: #fff; }
.quick-btn-5 { background: linear-gradient(135deg, #e67e22, #d35400); color: #fff; }
.quick-btn-12 { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; }
.quick-btn-50 { background: linear-gradient(135deg, #f0b90b, #d4a106); color: #111; }
.quick-btn-100 { background: linear-gradient(135deg, #2ecc71, #27ae60); color: #111; }
.quick-btn-all { background: linear-gradient(135deg, #555, #333); color: #fff; }

/* 百分比模式按钮 */
.quick-btn-pct { background: linear-gradient(135deg, #2c3e50, #1a2a3a); color: #fff; position: relative; }
.quick-btn-pct .pct-label { font-size: 16px; font-weight: 800; }
.quick-btn-pct .pct-val { font-size: 10px; opacity: 0.7; display: block; margin-top: 1px; }

/* ───── 自定义下注 ───── */
.custom-bet-row {
  display: flex; gap: 8px; margin-top: 10px;
}
.custom-bet-input {
  flex: 1; padding: 12px; border: 1px solid #3a5a4a; border-radius: 12px;
  background: var(--bg); color: var(--text); font-size: 16px; outline: none; min-width: 0;
  -moz-appearance: textfield;
}
.custom-bet-input::-webkit-inner-spin-button,
.custom-bet-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.custom-bet-input:focus { border-color: var(--accent); }
.custom-bet-input::placeholder { color: #5a7a6a; }
.custom-bet-btn {
  padding: 12px 24px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), #d4a106);
  color: #111; font-size: 15px; font-weight: 700; cursor: pointer;
  transition: transform 0.1s; flex-shrink: 0;
}
.custom-bet-btn:active { transform: scale(0.95); }

/* ───── 动作按钮 ───── */
.action-row { display: flex; gap: 10px; padding: 10px 12px; }
.action-btn {
  flex: 1; padding: 14px 0; border: none; border-radius: 14px;
  font-size: 16px; font-weight: 700; cursor: pointer; transition: opacity 0.2s, transform 0.1s;
}
.action-btn:active { transform: scale(0.96); }
.btn-collect { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; }
.btn-collect:disabled { opacity: 0.35; }
.btn-call { background: linear-gradient(135deg, #2980b9, #1a5276); color: #fff; }
.btn-call:disabled { opacity: 0.35; }
.btn-fold { background: linear-gradient(135deg, #555, #333); color: #fff; }

/* ───── 玩家列表 ───── */
.players-list {
  margin: 0 12px 12px; background: var(--card); border-radius: 14px; overflow: hidden;
}
.players-list-title {
  padding: 10px 14px; font-size: 12px; color: var(--sub);
  border-bottom: 1px solid #2a4a3a; display: flex; justify-content: space-between;
}
.player-row {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px;
  border-bottom: 1px solid #1a3a2a40; font-size: 13px;
}
.player-row:last-child { border-bottom: none; }
.player-row.me { background: #f0b90b0c; }
.pr-avatar {
  width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 14px; font-weight: bold; color: #fff; flex-shrink: 0;
}
.pr-info { flex: 1; min-width: 0; }
.pr-name { font-weight: 600; }
.pr-bet { font-size: 11px; color: var(--sub); margin-top: 1px; }
.pr-bal { font-size: 12px; color: var(--accent); font-weight: 600; }
.pr-wl { font-size: 10px; font-weight: 600; }
.pr-pot-bet {
  font-size: 10px; background: #f0b90b22; color: var(--accent); padding: 1px 6px;
  border-radius: 8px; font-weight: 600;
}

/* ───── 历史记录 ───── */
.history-list {
  margin: 0 12px 12px; background: var(--card); border-radius: 14px; overflow: hidden;
}
.history-title {
  padding: 10px 14px; font-size: 12px; color: var(--sub); border-bottom: 1px solid #2a4a3a;
}
.history-row {
  display: flex; align-items: center; gap: 8px; padding: 8px 14px;
  border-bottom: 1px solid #1a3a2a40; font-size: 12px;
}
.history-row:last-child { border-bottom: none; }
.history-winner { color: var(--accent); font-weight: 600; }
.history-amount { color: #c0d8c8; font-weight: 600; }

/* ───── 弹窗 ───── */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.75); z-index: 200; display: none;
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal-box { background: var(--card); border-radius: 16px; padding: 20px; width: 100%; max-width: 320px; }
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; text-align: center; }
.modal-input {
  width: 100%; padding: 12px; border: 1px solid #3a5a4a; border-radius: 10px;
  background: var(--bg); color: var(--text); font-size: 16px; margin-bottom: 14px; outline: none;
}
.modal-input:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 10px; }
.modal-btn { flex: 1; padding: 12px 0; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
.modal-cancel { background: #3a5a4a; color: var(--text); }
.modal-ok { background: var(--accent); color: #111; }

/* ───── 收池弹窗 ───── */
.winpot-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.88); z-index: 300; display: none;
  align-items: center; justify-content: center; flex-direction: column;
}
.winpot-overlay.show { display: flex; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.winpot-emoji { font-size: 64px; animation: bounce 0.5s ease 3; }
@keyframes bounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.3); } }
.winpot-label { font-size: 24px; font-weight: 800; margin-top: 8px; color: var(--accent); }
.winpot-amount { font-size: 36px; font-weight: 800; color: #fff; margin-top: 4px; }
.winpot-list { margin-top: 16px; width: 90%; max-width: 320px; max-height: 35vh; overflow-y: auto; }
.winpot-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 14px; background: #ffffff08; margin-bottom: 4px; border-radius: 8px; font-size: 13px;
}
.winpot-net-pos { color: var(--green); font-weight: 700; }
.winpot-net-neg { color: var(--danger); font-weight: 700; }

/* ───── Toast ───── */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.85); color: #fff; padding: 10px 20px; border-radius: 10px;
  font-size: 14px; z-index: 400; opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* ───── 重连遮罩 ───── */
.reconnect-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(13,27,20,0.93); z-index: 500; display: none;
  align-items: center; justify-content: center; flex-direction: column; gap: 12px;
}
.reconnect-overlay.show { display: flex; }
.reconnect-spinner {
  width: 40px; height: 40px; border: 3px solid #3a5a4a; border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.reconnect-text { color: var(--sub); font-size: 14px; }
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <div class="topbar-left">
    <div class="avatar-wrap" id="topbar-avatar"></div>
    <div class="topbar-info">
      <div class="topbar-name-row">
        <span class="player-name" id="my-name" onclick="openRenameModal()">玩家</span>
        <span style="font-size:11px;cursor:pointer" onclick="openRenameModal()">✏️</span>
      </div>
      <div class="balance-row">
        <span>💰 <span class="balance-val" id="my-balance">1000</span></span>
        <span>总输赢 <span class="winloss-val" id="my-winloss">0</span></span>
        <div class="conn-dot conn-ok" id="conn-dot"></div>
      </div>
    </div>
  </div>
</div>

<!-- 中央底池 -->
<div class="pot-area">
  <div class="pot-label">底池 POT</div>
  <div class="pot-amount" id="pot-amount">0</div>
  <div class="pot-chips" id="pot-chips"></div>
  <div class="pot-bets" id="pot-bets"></div>
  <div class="pot-stats">
    <span>我投入 <span class="pot-stat-val" id="my-pot-bet">0</span></span>
    <span>在线 <span class="pot-stat-val" id="online-count">0</span> 人</span>
  </div>
  <button class="pot-win-btn" id="btn-winpot" onclick="winPot()">🏆 收池</button>
</div>

<!-- 下注面板 -->
<div class="bet-panel">
  <div class="bet-panel-title">下注到底池</div>
  <div class="quick-bet-row" id="quick-bet-row">
    <!-- 动态生成：底池<10显示固定金额按钮，≥10显示百分比按钮 -->
  </div>
  <div class="custom-bet-row">
    <input type="number" id="custom-bet-input" class="custom-bet-input" placeholder="输入金额" min="1" inputmode="numeric">
    <button class="custom-bet-btn" onclick="customBet()">下注</button>
  </div>
</div>

<!-- 动作按钮 -->
<div class="action-row">
  <button class="action-btn btn-call" id="btn-call" onclick="callChips()">✋ 过牌</button>
  <button class="action-btn btn-collect" id="btn-collect" onclick="collectChips()">↩️ 收回下注</button>
  <button class="action-btn btn-fold" id="btn-fold" onclick="foldHand()">🚫 弃牌</button>
</div>

<!-- 玩家列表 -->
<div class="players-list">
  <div class="players-list-title">
    <span>🌐 在线玩家</span>
    <span id="players-count">0 人</span>
  </div>
  <div id="players-list-body"></div>
</div>

<!-- 历史记录 -->
<div class="history-list">
  <div class="history-title">📋 收池记录</div>
  <div id="history-list-body"></div>
</div>

<!-- 改名弹窗 -->
<div class="modal-overlay" id="rename-modal">
  <div class="modal-box">
    <div class="modal-title">✏️ 修改昵称</div>
    <input class="modal-input" id="rename-input" type="text" maxlength="12" placeholder="输入新昵称">
    <div class="modal-actions">
      <button class="modal-btn modal-cancel" onclick="closeRenameModal()">取消</button>
      <button class="modal-btn modal-ok" onclick="submitRename()">确定</button>
    </div>
  </div>
</div>

<!-- 收池弹窗 -->
<div class="winpot-overlay" id="winpot-overlay">
  <div class="winpot-emoji" id="winpot-emoji">🏆</div>
  <div class="winpot-label" id="winpot-label">—</div>
  <div class="winpot-amount" id="winpot-amount">0</div>
  <div class="winpot-list" id="winpot-list"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 重连遮罩 -->
<div class="reconnect-overlay" id="reconnect-overlay">
  <div class="reconnect-spinner"></div>
  <div class="reconnect-text" id="reconnect-text">连接断开，正在重连…</div>
</div>

<script>
// ─── 状态 ───
let ws = null;
let myId = null, myName = '', myBalance = 1000, myWinLoss = 0, myPotBet = 0, myFolded = false;
let potTotal = 0, potHistory = [], players = [];
let reconnectAttempts = 0, reconnectTimer = null, manuallyClosed = false;

// ─── 头像 ───
const AVATAR_COLORS = ['#e74c3c','#e67e22','#f39c12','#f1c40f','#2ecc71','#27ae60','#1abc9c','#16a085','#3498db','#2980b9','#9b59b6','#8e44ad','#e84393','#fd79a8','#00b894','#00cec9','#0984e3','#74b9ff','#a29bfe','#fab1a0','#ff7675','#636e72'];
const AVATAR_FONTS = ['🎮','🎲','🎯','🏆','⭐','💎','🔥','👑','🎩','🃏','🎪',' SLOT'];
// 四色筹码：个=白, 十=红, 百=蓝, 千=紫
const CHIP_COLORS = [
  { top: '#ecf0f1', side: '#95a5a6', label: '个' },
  { top: '#e74c3c', side: '#c0392b', label: '十' },
  { top: '#3498db', side: '#2471a3', label: '百' },
  { top: '#9b59b6', side: '#7d3c98', label: '千' },
];

function avatarFor(seed) {
  let h = 0;
  for (let i = 0; i < String(seed).length; i++) h = (h * 31 + String(seed).charCodeAt(i)) & 0xfffff;
  return { color: AVATAR_COLORS[h % AVATAR_COLORS.length], char: AVATAR_FONTS[(h >> 5) % AVATAR_FONTS.length] };
}
function avatarHTML(seed, size) {
  const a = avatarFor(seed);
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${a.color};font-size:${size*0.45}px">${a.char}</div>`;
}
// 颜色加深/变亮：percent 负数变暗，正数变亮
function shadeColor(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) + Math.round(2.55 * percent);
  let g = ((num >> 8) & 0xff) + Math.round(2.55 * percent);
  let b = (num & 0xff) + Math.round(2.55 * percent);
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

// ─── WebSocket 自动重连 ───
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}/ws`;
  try {
    ws = new WebSocket(url);
  } catch(e) { scheduleReconnect(); return; }

  ws.onopen = () => {
    reconnectAttempts = 0;
    hideReconnect(); setConnDot(true);
    const storedId = localStorage.getItem('chips_player_id') || null;
    ws.send(JSON.stringify({ type: 'join', name: myName || undefined, playerId: storedId }));
  };
  ws.onmessage = (e) => { try { handleMessage(JSON.parse(e.data)); } catch {} };
  ws.onclose = () => {
    setConnDot(false);
    if (!manuallyClosed) { showReconnect(); scheduleReconnect(); }
  };
  ws.onerror = () => setConnDot(false);
}

function scheduleReconnect() {
  if (reconnectTimer) return;
  const delay = Math.min(10000, Math.pow(2, reconnectAttempts) * 500);
  reconnectAttempts++;
  document.getElementById('reconnect-text').textContent = `连接断开，第 ${reconnectAttempts} 次重连…(${Math.round(delay)}ms)`;
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connectWS(); }, delay);
}

function hideReconnect() { document.getElementById('reconnect-overlay').classList.remove('show'); }
function showReconnect() { document.getElementById('reconnect-overlay').classList.add('show'); }
function setConnDot(ok) { document.getElementById('conn-dot').className = 'conn-dot ' + (ok ? 'conn-ok' : 'conn-bad'); }
function send(obj) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
  else showToast('连接已断开，正在重连…');
}

// ─── 消息处理 ───
function handleMessage(msg) {
  switch (msg.type) {
    case 'joined':
      myId = msg.playerId;
      localStorage.setItem('chips_player_id', myId);
      myName = msg.name; myBalance = msg.balance; myWinLoss = msg.totalWinLoss || 0; myPotBet = msg.potBet || 0;
      potTotal = msg.potTotal || 0; potHistory = msg.potHistory || [];
      updateAll(); break;

    case 'state':
      potTotal = msg.potTotal; potHistory = msg.potHistory || []; players = msg.players;
      const me = players.find(p => p.id === myId);
      if (me) { myPotBet = me.potBet; myFolded = me.folded || false; }
      updateAll(); break;

    case 'bet':
      if (msg.playerId === myId) { myBalance = msg.balance; myPotBet = msg.potBet; }
      potTotal = msg.potTotal;
      // 找到对应玩家更新
      const bp = players.find(p => p.id === msg.playerId);
      if (bp) { bp.balance = msg.balance; bp.potBet = msg.potBet; }
      updateAll();
      break;

    case 'collect':
      if (msg.playerId === myId) { myBalance = msg.balance; myPotBet = 0; }
      potTotal = msg.potTotal;
      const cp = players.find(p => p.id === msg.playerId);
      if (cp) { cp.balance = msg.balance; cp.potBet = 0; }
      updateAll();
      if (msg.playerId === myId) showToast(`收回 ${msg.amount} 筹码`);
      break;

    case 'renamed':
      if (msg.playerId === myId) { myName = msg.newName; }
      const rp = players.find(p => p.id === msg.playerId);
      if (rp) rp.name = msg.newName;
      updateAll();
      if (msg.playerId !== myId) showToast(`${msg.oldName} → ${msg.newName}`);
      break;

    case 'winPot':
      showWinPotOverlay(msg);
      if (msg.results[myId]) {
        myBalance = msg.results[myId].balance;
        myWinLoss = msg.results[myId].totalWinLoss;
        myPotBet = 0;
        myFolded = false;
      }
      potTotal = 0;
      for (const p of players) { p.potBet = 0; p.folded = false; }
      updateAll();
      break;

    case 'playerLeft':
      players = players.filter(p => p.id !== msg.playerId);
      updateAll(); break;

    case 'fold':
      if (msg.playerId === myId) { myFolded = true; showToast('已弃牌'); }
      const fp = players.find(p => p.id === msg.playerId);
      if (fp) fp.folded = true;
      updateAll(); break;

    case 'chipsAdded':
      if (msg.playerId === myId) { myBalance = msg.balance; }
      updateAll(); break;

    case 'error':
      showToast(msg.message); break;
  }
}

// ─── UI 渲染 ───
function updateAll() {
  updateTopbar(); updatePot(); updatePlayers(); updateHistory(); updateButtons();
}

function updateTopbar() {
  document.getElementById('my-name').textContent = myName;
  document.getElementById('my-balance').textContent = myBalance;
  const wlEl = document.getElementById('my-winloss');
  wlEl.textContent = (myWinLoss >= 0 ? '+' : '') + myWinLoss;
  wlEl.className = 'winloss-val ' + (myWinLoss >= 0 ? 'winloss-pos' : 'winloss-neg');
  document.getElementById('topbar-avatar').innerHTML = avatarHTML(myId || 'x', 40);
}

function updatePot() {
  document.getElementById('pot-amount').textContent = potTotal;
  document.getElementById('my-pot-bet').textContent = myPotBet;
  document.getElementById('online-count').textContent = players.filter(p => p.online).length;

  // 底池筹码视觉——按个十百千分堆，每堆芯片数=该位数字
  const chipsEl = document.getElementById('pot-chips');
  if (potTotal === 0) {
    chipsEl.innerHTML = '';
  } else {
    // 分解为个十百千四位
    const digits = [];
    let v = potTotal;
    for (let i = 0; i < 4; i++) { digits.push(v % 10); v = Math.floor(v / 10); }
    // digits[0]=个, [1]=十, [2]=百, [3]=千；从高位→低位渲染（左到右）
    let html = '';
    for (let s = 3; s >= 0; s--) {
      const count = digits[s];
      if (count === 0) continue;
      const c = CHIP_COLORS[s];
      html += `<div class="chip-stack">`;
      for (let i = 0; i < count; i++) {
        html += `<div class="chip" style="bottom:${14 + i * 5}px;z-index:${3 + i};background:linear-gradient(to bottom, ${c.top} 30%, ${c.side} 70%);border-color:${c.side};animation-delay:${i * 0.04}s"></div>`;
      }
      html += `<div class="denom" style="color:${c.top}">${c.label}</div>`;
      html += '</div>';
    }
    chipsEl.innerHTML = html;
  }

  // 牌桌上每个玩家的本轮下注标签
  const betsEl = document.getElementById('pot-bets');
  const bettors = players.filter(p => (p.potBet || 0) > 0).sort((a, b) => b.potBet - a.potBet);
  if (bettors.length === 0) {
    betsEl.innerHTML = '';
  } else {
    betsEl.innerHTML = bettors.map(p => {
      const isMe = p.id === myId;
      const a = avatarFor(p.avatarSeed);
      const offlineCls = p.online ? '' : ' offline';
      const foldedCls = (p.folded || false) ? ' folded' : '';
      return `<div class="pot-bet-tag ${isMe ? 'me' : ''}${offlineCls}${foldedCls}">
        <div class="pbt-avatar" style="background:${a.color}">${a.char}</div>
        <div class="pbt-info">
          <span class="pbt-name">${p.name}${isMe ? '(我)' : ''}</span>
          <span class="pbt-amount">${(p.folded || false) ? '🚫' : p.potBet}</span>
        </div>
      </div>`;
    }).join('');
  }
}

function updatePlayers() {
  const body = document.getElementById('players-list-body');
  document.getElementById('players-count').textContent = players.length + ' 人';
  if (!players.length) { body.innerHTML = '<div style="padding:16px;text-align:center;color:var(--sub)">等待其他玩家…</div>'; return; }
  const sorted = [...players].sort((a, b) => (b.potBet || 0) - (a.potBet || 0));
  body.innerHTML = sorted.map(p => {
    const isMe = p.id === myId;
    const wl = p.totalWinLoss || 0;
    const wlClass = wl >= 0 ? 'winloss-pos' : 'winloss-neg';
    const a = avatarFor(p.avatarSeed);
    return `
      <div class="player-row ${isMe ? 'me' : ''}">
        <div class="pr-avatar" style="background:${a.color}">${a.char}</div>
        <div class="pr-info">
          <div class="pr-name">${p.name}${isMe ? ' (我)' : ''}</div>
          <div class="pr-bet">${(p.folded || false) ? '🚫 已弃牌' : (p.potBet > 0 ? '已投入底池' : '未下注')}</div>
        </div>
        <div style="text-align:right">
          ${p.potBet > 0 ? `<span class="pr-pot-bet">+${p.potBet}</span> ` : ''}
          <span class="pr-bal">💰${p.balance}</span>
          <div class="pr-wl ${wlClass}">${wl >= 0 ? '+' : ''}${wl}</div>
        </div>
      </div>`;
  }).join('');
}

function updateHistory() {
  const body = document.getElementById('history-list-body');
  if (!potHistory.length) { body.innerHTML = '<div style="padding:12px 14px;color:var(--sub);font-size:12px">暂无记录</div>'; return; }
  body.innerHTML = potHistory.map(h => `
    <div class="history-row">
      <span class="history-winner">🏆 ${h.winner}</span>
      <span class="history-amount">收走 ${h.amount}</span>
    </div>`).join('');
}

function updateButtons() {
  // 动态快捷下注按钮
  const row = document.getElementById('quick-bet-row');
  if (myFolded) {
    row.innerHTML = '<div style="text-align:center;color:var(--sub);font-size:12px;padding:8px">已弃牌，等待本轮结束</div>';
  } else if (potTotal < 10) {
    row.innerHTML = `
      <button class="quick-btn quick-btn-1" onclick="quickBet(1)">1</button>
      <button class="quick-btn quick-btn-2" onclick="quickBet(2)">2</button>
      <button class="quick-btn quick-btn-5" onclick="quickBet(5)">5</button>
      <button class="quick-btn quick-btn-12" onclick="quickBet(12)">12</button>
      <button class="quick-btn quick-btn-50" onclick="quickBet(50)">50</button>
      <button class="quick-btn quick-btn-100" onclick="quickBet(100)">100</button>
      <button class="quick-btn quick-btn-all" onclick="quickBetAll()">全押</button>
    `;
  } else {
    const pcts = [0.2, 0.33, 0.5, 0.75, 1.0];
    const labels = ['20%', '33%', '50%', '75%', '100%'];
    row.innerHTML = pcts.map((pct, i) => {
      const val = Math.max(1, Math.floor(potTotal * pct));
      return `<button class="quick-btn quick-btn-pct" onclick="quickBet(${val})">
        <span class="pct-label">${labels[i]}</span>
        <span class="pct-val">${val}</span>
      </button>`;
    }).join('') + `<button class="quick-btn quick-btn-all" onclick="quickBetAll()">全押</button>`;
  }

  // Call / Check / Fold 按钮状态
  const btnCall = document.getElementById('btn-call');
  const btnCollect = document.getElementById('btn-collect');
  const btnWinpot = document.getElementById('btn-winpot');
  if (btnCollect) btnCollect.disabled = myPotBet === 0 || myFolded;

  // 计算最高下注（仅活跃玩家）
  const activePlayers = players.filter(p => p.online && !(p.folded || false));
  const maxBet = activePlayers.reduce((m, p) => Math.max(m, p.potBet || 0), 0);

  if (btnCall) {
    if (myFolded) {
      btnCall.disabled = true;
      btnCall.textContent = '🚫 已弃牌';
    } else if (maxBet > (myPotBet || 0)) {
      btnCall.disabled = false;
      const need = maxBet - (myPotBet || 0);
      btnCall.textContent = `📣 跟注 ${Math.min(need, myBalance)}`;
    } else {
      btnCall.disabled = true;
      btnCall.textContent = '✋ 过牌';
    }
  }

  if (btnWinpot) btnWinpot.disabled = potTotal === 0 || myFolded;
}

// ─── 交互 ───
function quickBet(amount) { send({ type: 'bet', amount }); }
function quickBetAll() { send({ type: 'bet', amount: myBalance }); }

function customBet() {
  const input = document.getElementById('custom-bet-input');
  const val = parseInt(input.value, 10);
  if (!val || val <= 0) { showToast('请输入有效金额'); return; }
  if (val > myBalance) { showToast('余额不足！'); return; }
  send({ type: 'bet', amount: val });
  input.value = '';
}
function collectChips() { send({ type: 'collect' }); }
function callChips() { send({ type: 'call' }); }
function foldHand() { send({ type: 'fold' }); }
function winPot() {
  if (potTotal === 0) return;
  send({ type: 'winPot' });
}

// ─── 改名 ───
function openRenameModal() {
  document.getElementById('rename-input').value = myName;
  document.getElementById('rename-modal').classList.add('show');
  setTimeout(() => document.getElementById('rename-input').focus(), 100);
}
function closeRenameModal() { document.getElementById('rename-modal').classList.remove('show'); }
function submitRename() {
  const v = document.getElementById('rename-input').value.trim();
  if (!v) { showToast('昵称不能为空'); return; }
  send({ type: 'rename', name: v }); closeRenameModal();
}

// ─── 收池弹窗 ───
function showWinPotOverlay(msg) {
  document.getElementById('winpot-emoji').textContent = '🏆';
  document.getElementById('winpot-label').textContent = msg.winnerName + ' 收池!';
  document.getElementById('winpot-amount').textContent = '+' + msg.amount;
  const list = document.getElementById('winpot-list');
  list.innerHTML = Object.entries(msg.results).map(([pid, info]) => {
    const isMe = pid === myId;
    const cls = info.net >= 0 ? 'winpot-net-pos' : 'winpot-net-neg';
    return `<div class="winpot-row">
      <span>${info.name}${isMe ? ' (我)' : ''} <span style="color:var(--sub);font-size:11px">投${info.contribution}</span></span>
      <span class="${cls}">${info.net >= 0 ? '+' : ''}${info.net}</span>
    </div>`;
  }).join('');
  const ov = document.getElementById('winpot-overlay');
  ov.classList.add('show');
  setTimeout(() => ov.classList.remove('show'), 4000);
}

// ─── Toast ───
let toastTimer;
function showToast(t) {
  const el = document.getElementById('toast');
  el.textContent = t; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ─── 键盘 ───
document.getElementById('rename-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitRename();
  else if (e.key === 'Escape') closeRenameModal();
});

// 自定义输入框回车下注
document.getElementById('custom-bet-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') customBet();
});

// ─── 启动 ───
myName = localStorage.getItem('chips_player_name') || '';
connectWS();

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && ws && ws.readyState > 1) connectWS();
});
</script>
